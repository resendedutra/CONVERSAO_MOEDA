<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Conversor de Moeds</title>
</head>

<body>

    <img class="logo" src="./assets/logo.gif" alt="logo-convert-money">

    <main>

        <label> Converter <b>de</b>

            <select class="select-convert">

                <option value="conversion-real">R$ Real</option>
                <option value="conversion-dolar">$ Dolar</option>
                <option value="conversion-euro">€ Euro</option>
                <option value="conversion-libra">£ Libra</option>
                <option value="conversion-bitcoin">₿ Bitcoin</option>

            </select>

        </label>

        <label> Converter <b>para</b>

            <select class="select-converted">

                <option value="real">R$ Real</option>
                <option value="dolar">$ Dolar</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin">₿ Bitcoin</option>

            </select>

        </label>

        <label> Valor

           <input class="input-currency" placeholder="R$ 10.000,00">

        </label>

        <button class="convert-button">Converter</button>

        <section>

            <div class="currency-box">

                <img class="image-flag-convert" src="./assets/real.svg" alt="logo-moeda-a-converter">
                <p class="currency-convert">Real</p>
                <p class="convert-currency-value">R$ 0,00</p>

            </div>

            <img class="arrow-img" src="./assets/seta.svg" alt="seta">

            <div class="currency-box">

                <img class="image-flag-converted" src="./assets/dolar.svg" alt="logo-moeda-convertida">
                <p class="currency-converted">Dólar</p>
                <p class="converted-currency-value">$ 0.00</p>

            </div>

        </section>

    </main>

</body>

<script src="./script.js"></script>

</html>
